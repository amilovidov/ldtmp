<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One LDTMP turn">
<defs><marker id="a-gated" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f5fa7"/></marker><marker id="a-forward" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#59636e"/></marker><marker id="a-retreat" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8c959f"/></marker></defs>
<rect x="20" y="30" width="1100" height="190" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="40" y="52" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central" fill="#59636e">CONTROLLER  (deterministic)</text>
<rect x="20" y="270" width="1100" height="190" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="40" y="292" font-size="11" font-weight="600" text-anchor="start" dominant-baseline="central" fill="#59636e">MODEL  (generative)</text>
<rect x="50" y="111" width="160" height="48" rx="8" fill="#eaf2fc" stroke="#a5c1e8" stroke-width="1.2"/><text x="130.0" y="135.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#1f2328">Signals and scores</text>
<rect x="280" y="111" width="150" height="48" rx="20" fill="#f6f8fa" stroke="#6f97cf" stroke-width="1.2" stroke-dasharray="4 3"/><text x="355.0" y="135.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#1f2328">Rule fires?</text>
<rect x="510" y="103" width="210" height="64" rx="20" fill="#f6f8fa" stroke="#6f97cf" stroke-width="1.2" stroke-dasharray="4 3"/><text x="615.0" y="126.5" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#1f2328">Descending and</text><text x="615.0" y="143.5" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#1f2328">safety below 0.5?</text>
<rect x="890" y="111" width="180" height="48" rx="8" fill="#c3d7f3" stroke="#6f97cf" stroke-width="1.2"/><text x="980.0" y="135.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#1f2328">Layer for this turn</text>
<path d="M210,135 L276,135" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-forward)"/>
<path d="M430,135 L506,135" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-forward)"/>
<text x="468" y="123" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#59636e">yes</text>
<path d="M720,135 L886,135" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-forward)"/>
<text x="803" y="123" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#59636e">no: move</text>
<path d="M615,167 C615,197 980,197 980,163" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-forward)"/>
<text x="800" y="201" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#59636e">yes: veto, stay</text>
<path d="M355,111 C355,63 980,63 980,107" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-forward)"/>
<text x="668" y="65" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#59636e">no rule: stay</text>
<path d="M1070,135 L1130,135 Q1138,135 1138,143 L1138,237 Q1138,245 1130,245 L183,245 Q175,245 175,253 L175,347" fill="none" stroke="#2f5fa7" stroke-width="2.0" marker-end="url(#a-gated)"/>
<text x="610" y="233" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#2f5fa7">layer constraints</text>
<rect x="50" y="351" width="160" height="48" rx="8" fill="#eaf2fc" stroke="#a5c1e8" stroke-width="1.2"/><text x="130.0" y="375.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#1f2328">Prompt</text>
<rect x="300" y="351" width="220" height="48" rx="8" fill="#2f5fa7" stroke="#244b85" stroke-width="1.2"/><text x="410.0" y="375.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#ffffff">Model writes one question</text>
<rect x="610" y="351" width="170" height="48" rx="20" fill="#f6f8fa" stroke="#6f97cf" stroke-width="1.2" stroke-dasharray="4 3"/><text x="695.0" y="375.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#1f2328">Fits the layer?</text>
<rect x="890" y="351" width="180" height="48" rx="8" fill="#c3d7f3" stroke="#6f97cf" stroke-width="1.2"/><text x="980.0" y="375.0" font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#1f2328">Question to user</text>
<path d="M210,375 L296,375" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-forward)"/>
<path d="M520,375 L606,375" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-forward)"/>
<path d="M780,375 L886,375" fill="none" stroke="#59636e" stroke-width="1.5" marker-end="url(#a-forward)"/>
<text x="833" y="363" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#59636e">yes</text>
<path d="M695,399 C695,437 410,437 410,403" fill="none" stroke="#8c959f" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a-retreat)"/>
<text x="552" y="437" font-size="13" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#59636e">no: regenerate once</text>
</svg>